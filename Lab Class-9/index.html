<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Interactive Demo</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #f4f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      margin-top: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    .section {
      margin-top: 30px;
      margin-bottom: 30px;
    }
    .output {
      background-color: #f1f3f6;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JavaScript Interactive Demo</h1>


    <div class="section">
      <h2>Variables & Data Types</h2>
      <div class="output" id="varsOutput"></div>
    </div>

  
    <div class="section">
      <h2>Type Casting & Number Methods</h2>
      <div class="output" id="castingOutput"></div>
    </div>

    
    <div class="section">
      <h2>Arithmetic & Functions</h2>
      <button class="btn btn-primary" onclick="calculateSum()">Calculate Sum</button>
      <div class="output" id="calcOutput"></div>
    </div>

 
    <div class="section">
      <h2>User Input</h2>
      <button class="btn btn-success" onclick="getStudentName()">Enter Name</button>
      <div class="output" id="userOutput"></div>
    </div>

  
    <div class="section">
      <h2>Alerts & Prompts</h2>
      <button class="btn btn-warning" onclick="showAlert()">Show Alert</button>
      <button class="btn btn-info" onclick="askAge()">Ask Age</button>
      <div class="output" id="alertOutput"></div>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
